services:
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/repo/data
      - ./templates:/repo/templates
      - ./applications:/repo/applications
      - ./resume_master.md:/repo/resume_master.md
      - ./resume_master_de.md:/repo/resume_master_de.md
      - ./app/backend/app.db:/repo/app/backend/app.db

  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
